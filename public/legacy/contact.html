<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contacta con No1 Excursiones para actividades, reservas y asesoramiento en Tenerife.">
    <title>Contacto | No1 Excursiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
  </head>
  <body data-site-root="." data-page="contact">
    <header data-site-header></header>
    <main>
      <section class="page-hero compact-hero" style="--hero-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1800&q=80')">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
          <p class="eyebrow" data-i18n="contactEyebrow">Contacto</p>
          <h1 data-i18n="contactHeroTitle">Hablemos de tu viaje a Tenerife.</h1>
          <p data-i18n="contactHeroText">Escribe al equipo para dudas, grupos, reservas especiales o propuestas a medida.</p>
        </div>
      </section>
      <section class="section section-muted">
        <div class="container">
          <div class="row g-4">
            <div class="col-lg-5">
              <p class="section-kicker" data-i18n="contactDetails">Datos</p>
              <h2 data-i18n="contactSectionTitle">Estamos en Tenerife.</h2>
              <div class="info-panel mt-4">
                <div><span data-i18n="contactEmail">Email</span><strong>hola@no1excursiones.com</strong></div>
                <div><span data-i18n="contactPhone">Telefono</span><strong>+34 000 000 000</strong></div>
                <div><span data-i18n="contactHours">Horario</span><strong data-i18n="contactHoursValue">Lunes a sabado</strong></div>
              </div>
            </div>
            <div class="col-lg-7">
              <form class="contact-panel" data-demo-form>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label" data-i18n="formName">Nombre</label>
                    <input class="form-control" name="name" required autocomplete="name">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input class="form-control" type="email" name="email" required autocomplete="email">
                  </div>
                  <div class="col-12">
                    <label class="form-label" data-i18n="formTopic">Motivo</label>
                    <select class="form-select" name="topic">
                      <option data-i18n="formTopicBooking">Reserva de actividad</option>
                      <option data-i18n="formTopicCall">Llamada de asesoramiento</option>
                      <option data-i18n="formTopicGroup">Grupo privado</option>
                      <option data-i18n="formTopicOther">Otra consulta</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label" data-i18n="formMessage">Mensaje</label>
                    <textarea class="form-control" name="message" rows="5" required></textarea>
                  </div>
                  <div class="col-12 d-grid d-sm-flex align-items-center gap-3">
                    <button class="btn btn-primary" type="submit" data-i18n="formSend">Enviar mensaje</button>
                    <div data-form-result></div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer data-site-footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/calendar.js"></script>
  </body>
</html>
