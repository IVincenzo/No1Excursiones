<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Consulta eventos locales en Tenerife: espectaculos, mercados, conciertos, fiestas y planes de temporada.">
    <title>Eventos locales | No1 Excursiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
  </head>
  <body data-site-root="." data-page="events">
    <header data-site-header></header>
    <main>
      <section class="page-hero compact-hero" style="--hero-image: url('https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=1800&q=80')">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
          <p class="eyebrow" data-i18n="eventsEyebrow">Agenda local</p>
          <h1 data-i18n="eventsHeroTitle">Eventos locales en Tenerife.</h1>
          <p data-i18n="eventsHeroText">Un panel vivo con planes de la isla: espectaculos, mercados, musica, gastronomia y fiestas locales.</p>
        </div>
      </section>

      <section class="section section-muted">
        <div class="container">
          <div class="events-board">
            <div class="events-board-header">
              <div>
                <p class="section-kicker" data-i18n="eventsBoardKicker">Panel de eventos</p>
                <h2 data-i18n="eventsBoardTitle">Que ocurre estos dias</h2>
              </div>
              <p class="events-updated mb-0">
                <span data-i18n="eventsUpdated">Actualizado</span>
                <strong data-events-updated></strong>
              </p>
            </div>

            <div class="events-filters">
              <label class="form-label">
                <span data-i18n="eventsFilterCategory">Categoria</span>
                <select class="form-select" data-events-category></select>
              </label>
              <label class="form-label">
                <span data-i18n="eventsFilterPeriod">Fecha</span>
                <select class="form-select" data-events-period></select>
              </label>
            </div>

            <div class="events-grid" data-events-list></div>
            <div class="events-empty" data-events-empty hidden data-i18n="eventsNoResults">No hay eventos para estos filtros.</div>
          </div>
        </div>
      </section>
    </main>
    <footer data-site-footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/events.js"></script>
  </body>
</html>
